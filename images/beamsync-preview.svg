<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <rect width="600" height="340" fill="#0e1116"/>
  <rect x="0" y="0" width="600" height="340" fill="url(#grid)" opacity="0.15"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ff4400" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect x="15" y="15" width="570" height="310" rx="0" stroke="#ff4400" stroke-width="1" opacity="0.3"/>
  <rect x="15" y="15" width="570" height="34" rx="0" fill="#ff4400" fill-opacity="0.15"/>
  <rect x="15" y="49" width="570" height="1" fill="#ff4400" opacity="0.4"/>
  <text x="25" y="37" font-family="monospace" font-size="11" fill="#ff4400" font-weight="bold" letter-spacing="2">BEAMSYNC // P2P TRANSFER v2.0</text>
  <rect x="25" y="65" width="260" height="245" rx="0" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="#050505"/>
  <text x="35" y="85" font-family="monospace" font-size="9" fill="#94a3b8" letter-spacing="1">TERMINAL // NODE_A</text>
  <text x="35" y="105" font-family="monospace" font-size="8" fill="#555">> beam sync --scan-network</text>
  <text x="35" y="120" font-family="monospace" font-size="8" fill="#00ffaa">[OK] Interface: wlan0 (192.168.1.15)</text>
  <text x="35" y="135" font-family="monospace" font-size="8" fill="#00ffaa">[OK] Scanning ports 9000-9100...</text>
  <text x="35" y="150" font-family="monospace" font-size="8" fill="#ff4400">[!] Peer found: 192.168.1.22:9042</text>
  <text x="35" y="165" font-family="monospace" font-size="8" fill="#00ffaa">[OK] Handshake: AES-256-GCM established</text>
  <text x="35" y="180" font-family="monospace" font-size="8" fill="#00ffaa">[OK] Transfer rate: 24.7 MB/s</text>
  <text x="35" y="195" font-family="monospace" font-size="8" fill="#f0f2f5">> Sending: ./payload_large.iso (1.2GB)</text>
  <text x="35" y="210" font-family="monospace" font-size="8" fill="#f0f2f5">  [===========                 ]  42%</text>
  <text x="35" y="225" font-family="monospace" font-size="8" fill="#555">  ETA: 34s | Speed: 24.7 MB/s</text>
  <rect x="35" y="240" width="240" height="1" fill="rgba(255,255,255,0.06)"/>
  <text x="35" y="255" font-family="monospace" font-size="8" fill="#f0f2f5">> beam transfer --qr</text>
  <text x="35" y="270" font-family="monospace" font-size="8" fill="#00ffaa">[OK] QR code generated for mobile sync</text>
  <text x="35" y="285" font-family="monospace" font-size="7" fill="#555">Scan with BeamSync mobile app</text>
  <text x="35" y="300" font-family="monospace" font-size="7" fill="#555">Type 'help' for commands</text>
  <rect x="300" y="65" width="275" height="120" rx="0" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="rgba(255,255,255,0.02)"/>
  <text x="310" y="85" font-family="monospace" font-size="9" fill="#94a3b8" letter-spacing="1">NETWORK TOPOLOGY</text>
  <rect x="345" y="95" width="60" height="40" rx="0" stroke="#ff4400" stroke-width="1" fill="rgba(255,68,0,0.1)"/>
  <text x="350" y="118" font-family="monospace" font-size="7" fill="#ff4400">NODE_A</text>
  <rect x="470" y="95" width="60" height="40" rx="0" stroke="#00ffaa" stroke-width="1" fill="rgba(0,255,170,0.1)"/>
  <text x="475" y="118" font-family="monospace" font-size="7" fill="#00ffaa">NODE_B</text>
  <line x1="405" y1="115" x2="470" y2="115" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="4 3"/>
  <polygon points="468,110 475,115 468,120" fill="rgba(255,255,255,0.2)"/>
  <text x="420" y="108" font-family="monospace" font-size="6" fill="#555">24.7 MB/s</text>
  <rect x="310" y="145" width="60" height="30" rx="0" stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="rgba(255,255,255,0.02)"/>
  <text x="315" y="163" font-family="monospace" font-size="6" fill="#555">PORT: 9042</text>
  <rect x="380" y="145" width="60" height="30" rx="0" stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="rgba(255,255,255,0.02)"/>
  <text x="385" y="163" font-family="monospace" font-size="6" fill="#555">PROTO: TCP</text>
  <rect x="450" y="145" width="60" height="30" rx="0" stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="rgba(255,255,255,0.02)"/>
  <text x="455" y="163" font-family="monospace" font-size="6" fill="#555">CIPHER: AES</text>
  <rect x="300" y="200" width="275" height="110" rx="0" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="rgba(255,255,255,0.02)"/>
  <text x="310" y="220" font-family="monospace" font-size="9" fill="#94a3b8" letter-spacing="1">TRANSFER STATS</text>
  <rect x="310" y="230" width="120" height="65" rx="0" stroke="rgba(0,255,170,0.3)" stroke-width="1" fill="rgba(0,255,170,0.05)"/>
  <text x="320" y="248" font-family="monospace" font-size="8" fill="#00ffaa">PEAK SPEED</text>
  <text x="320" y="272" font-family="monospace" font-size="18" fill="#00ffaa" font-weight="bold">47.2</text>
  <text x="320" y="288" font-family="monospace" font-size="7" fill="#555">MB/s</text>
  <rect x="440" y="230" width="120" height="65" rx="0" stroke="rgba(255,68,0,0.3)" stroke-width="1" fill="rgba(255,68,0,0.05)"/>
  <text x="450" y="248" font-family="monospace" font-size="8" fill="#ff4400">FILES SENT</text>
  <text x="450" y="272" font-family="monospace" font-size="18" fill="#ff4400" font-weight="bold">156</text>
  <text x="450" y="288" font-family="monospace" font-size="7" fill="#555">this session</text>
</svg>
